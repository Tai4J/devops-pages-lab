name: Build, deploy and smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_stale:
        description: "Demo: build with an OLD version stamp"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      expected: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Write version.txt
        run: |
          if [ "${{ inputs.simulate_stale }}" = "true" ]; then
            git rev-parse HEAD~1 > version.txt   # deliberately stamp an OLD version
          else
            echo "${{ github.sha }}" > version.txt
          fi
          echo "version.txt = $(cat version.txt)"
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Live site must serve this exact version
        run: |
          EXPECTED="${{ needs.build.outputs.expected }}"
          URL="${{ needs.deploy.outputs.page_url }}version.txt"
          for i in $(seq 1 10); do
            LIVE=$(curl -fsS "$URL?nocache=$(date +%s)" | tr -d '[:space:]' || true)
            echo "Try $i: live=$LIVE expected=$EXPECTED"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Live site is not serving $EXPECTED"
          exit 1
